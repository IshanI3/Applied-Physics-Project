<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Virtual Lab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for real-time diagnostics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lab: {
                            darkBg: '#0f172a',
                            darkPanel: '#1e293b',
                            darkBorder: '#334155',
                            lightBg: '#f8fafc',
                            lightPanel: '#ffffff',
                            lightBorder: '#e2e8f0',
                            accent: '#3b82f6',
                            accentGlow: '#60a5fa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .mono-text {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Glassmorphism styles */
        .glass-panel-dark {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-panel-light {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }

        /* Range Slider styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            border-radius: 3px;
            background: rgba(156, 163, 175, 0.3);
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
            transition: all 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Canvas Overlay styles */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-lab-lightBg dark:bg-lab-darkBg text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="h-16 border-b border-lab-lightBorder dark:border-lab-darkBorder bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 flex items-center justify-between px-4 lg:px-6">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                <i class="fa-solid font-bold text-xl fa-atom"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent dark:from-blue-400 dark:to-indigo-300">PhysiLab 3D Dynamic</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Interactive Physics Virtual Laboratory</p>
            </div>
        </div>

        <!-- Tab Selector - Desktop -->
        <nav class="hidden lg:flex items-center space-x-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-sm font-medium">
            <button onclick="switchTab('projectile')" id="tab-projectile" class="nav-tab px-4 py-2 rounded-lg transition-all flex items-center space-x-2">
                <i class="fa-solid fa-person-skiing-nordic"></i><span>2D Projectile</span>
            </button>
            <button onclick="switchTab('electro')" id="tab-electro" class="nav-tab px-4 py-2 rounded-lg transition-all flex items-center space-x-2">
                <i class="fa-solid fa-bolt"></i><span>Electrostatics</span>
            </button>
            <button onclick="switchTab('magnet')" id="tab-magnet" class="nav-tab px-4 py-2 rounded-lg transition-all flex items-center space-x-2">
                <i class="fa-solid fa-magnet"></i><span>Magnetism</span>
            </button>
            <button onclick="switchTab('shm')" id="tab-shm" class="nav-tab px-4 py-2 rounded-lg transition-all flex items-center space-x-2">
                <i class="fa-solid fa-wave-square"></i><span>SHM</span>
            </button>
            <button onclick="switchTab('gravity')" id="tab-gravity" class="nav-tab px-4 py-2 rounded-lg transition-all flex items-center space-x-2">
                <i class="fa-solid fa-globe"></i><span>Gravitation</span>
            </button>
        </nav>

        <!-- Right Side Utility Controls -->
        <div class="flex items-center space-x-3">
            <!-- Mobile Navigation Dropdown -->
            <select id="mobile-tab-select" onchange="switchTab(this.value)" class="lg:hidden bg-slate-100 dark:bg-slate-800 border-none text-sm font-medium rounded-lg px-3 py-2 text-slate-800 dark:text-slate-200">
                <option value="projectile">2D Projectile</option>
                <option value="electro">Electrostatics</option>
                <option value="magnet">Magnetism</option>
                <option value="shm">SHM / Pendulum</option>
                <option value="gravity">Gravitation</option>
            </select>

            <!-- Theme Toggle -->
            <button id="theme-toggle" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
                <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
            </button>
            
            <button onclick="toggleTheoryDrawer()" class="px-3 py-2 text-sm rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors flex items-center space-x-2 font-medium">
                <i class="fa-solid fa-book"></i>
                <span class="hidden sm:inline">Theory & Formulas</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
        
        <!-- Left Sidebar - Control Panel -->
        <aside class="w-full lg:w-96 border-b lg:border-b-0 lg:border-r border-lab-lightBorder dark:border-lab-darkBorder bg-white/50 dark:bg-slate-900/50 backdrop-blur-lg flex flex-col h-auto lg:h-full z-20 overflow-y-auto">
            
            <!-- Global Simulation Controls -->
            <div class="p-4 border-b border-lab-lightBorder dark:border-lab-darkBorder space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">Global Controls</span>
                    <span id="fps-counter" class="text-xs mono-text text-green-500 font-medium">60 FPS</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="btn-play" onclick="togglePlayPause()" class="flex-1 py-2 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium flex items-center justify-center space-x-2 transition shadow-md shadow-blue-500/20">
                        <i id="play-icon" class="fa-solid fa-pause"></i><span id="play-text">Pause</span>
                    </button>
                    <button onclick="stepSimulation()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition active:scale-95">
                        <i class="fa-solid fa-step-forward"></i>
                    </button>
                    <button onclick="resetCurrentTab()" class="p-2.5 rounded-xl bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-200 dark:hover:bg-red-900/50 transition active:scale-95">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>

                <!-- Simulation Speed Slider -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-500 dark:text-slate-400">Simulation Speed</span>
                        <span id="speed-val" class="mono-text font-medium">1.0x</span>
                    </div>
                    <input type="range" id="sim-speed" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateSimSpeed(this.value)" class="w-full">
                </div>
            </div>

            <!-- Dynamic Tab Controls Container -->
            <div id="controls-container" class="p-4 flex-1 space-y-6">
                <!-- Injected via JS based on active lab tab -->
            </div>
        </aside>

        <!-- Right / Central - Interactive Canvas Section -->
        <main class="flex-1 relative bg-slate-100 dark:bg-slate-950 flex flex-col overflow-hidden">
            
            <!-- Canvas HUD Overlay (Top Right) -->
            <div class="absolute top-4 right-4 z-10 flex flex-col space-y-2 pointer-events-none">
                <div id="hud-panel" class="glass-panel-light dark:glass-panel-dark rounded-2xl p-4 shadow-xl border text-xs space-y-2 min-w-[200px] pointer-events-auto">
                    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-2 mb-2">
                        <span class="font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider text-[10px]">Real-Time Diagnostics</span>
                        <span id="hud-status" class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    </div>
                    <div id="hud-metrics" class="space-y-1.5 mono-text text-slate-600 dark:text-slate-300">
                        <!-- Dynamic HUD Items populated via JS -->
                    </div>
                </div>
            </div>

            <!-- Canvas Visualization Toggles Bar (Bottom Right overlay) -->
            <div class="absolute bottom-4 right-4 z-10 glass-panel-light dark:glass-panel-dark rounded-xl p-2 shadow-lg border flex items-center space-x-2 text-xs">
                <button onclick="toggleVisualSetting('vectors')" id="toggle-vectors" class="px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 font-medium transition bg-blue-500 text-white">Vectors</button>
                <button onclick="toggleVisualSetting('grid')" id="toggle-grid" class="px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 font-medium transition bg-blue-500 text-white">Grid</button>
                <button onclick="toggleVisualSetting('trail')" id="toggle-trail" class="px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 font-medium transition bg-blue-500 text-white">Trails</button>
            </div>

            <!-- Main Interactive Canvas -->
            <div class="canvas-container flex-1 bg-white dark:bg-slate-950">
                <canvas id="lab-canvas" class="w-full h-full block cursor-crosshair"></canvas>
            </div>

            <!-- Optional Real-time Graph Drawer (For SHM / Projectile) -->
            <div id="graph-panel" class="h-44 border-t border-lab-lightBorder dark:border-lab-darkBorder bg-white/90 dark:bg-slate-900/90 backdrop-blur-md p-2 hidden relative">
                <div class="flex justify-between items-center px-2 mb-1">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Live Dynamic Chart</span>
                    <button onclick="toggleGraphPanel(false)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="w-full h-32">
                    <canvas id="chart-canvas"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- Theory / Formulas Drawer (Slide-Over) -->
    <div id="theory-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-white dark:bg-slate-900 shadow-2xl z-50 transform translate-x-full transition-transform duration-300 border-l border-slate-200 dark:border-slate-800 flex flex-col">
        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <h2 class="font-bold text-lg flex items-center space-x-2">
                <i class="fa-solid fa-graduation-cap text-blue-500"></i>
                <span id="theory-title">Physics Theory & Formulas</span>
            </h2>
            <button onclick="toggleTheoryDrawer()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div id="theory-content" class="p-6 overflow-y-auto flex-1 space-y-6 text-sm text-slate-600 dark:text-slate-300">
            <!-- Injected dynamically per module -->
        </div>
    </div>

    <script>
        /*
         *  PHYSICS VIRTUAL LAB ENGINE
         *  Clean Single Engine Loop with Switching Modules
         */

        // App State
        const state = {
            theme: 'dark',
            activeTab: 'projectile',
            isRunning: true,
            simSpeed: 1.0,
            visuals: {
                vectors: true,
                grid: true,
                trail: true
            },
            fps: 60,
            frameCount: 0,
            lastFpsUpdate: performance.now(),
            timeStep: 0.016, // Default frame delta in seconds
            canvas: null,
            ctx: null,
            width: 0,
            height: 0,
            chart: null,
            isGraphOpen: false
        };

        // Module Specific States
        const labModules = {
            // -------------------------------------------------------------
            // 1. PROJECTILE MOTION
            // -------------------------------------------------------------
            projectile: {
                title: "2D Projectile Motion",
                params: {
                    v0: 35,          // m/s
                    angle: 45,       // deg
                    gravity: 9.81,   // m/s^2
                    height: 0,       // initial launch height (m)
                    targetX: 100,    // Target position (m)
                    showTarget: true
                },
                // Simulation Dynamic State
                pos: { x: 0, y: 0 },
                vel: { x: 0, y: 0 },
                time: 0,
                trail: [],
                maxHeightReached: 0,
                totalDistance: 0,
                landingTime: 0,
                isLanded: false,

                init() {
                    const rad = (this.params.angle * Math.PI) / 180;
                    this.pos = { x: 0, y: this.params.height };
                    this.vel = {
                        x: this.params.v0 * Math.cos(rad),
                        y: this.params.v0 * Math.sin(rad)
                    };
                    this.time = 0;
                    this.trail = [{ ...this.pos }];
                    this.maxHeightReached = this.params.height;
                    this.totalDistance = 0;
                    this.landingTime = 0;
                    this.isLanded = false;
                },

                update(dt) {
                    if (this.isLanded) return;

                    this.time += dt;
                    this.vel.y -= this.params.gravity * dt;
                    this.pos.x += this.vel.x * dt;
                    this.pos.y += this.vel.y * dt;

                    if (this.pos.y > this.maxHeightReached) {
                        this.maxHeightReached = this.pos.y;
                    }

                    // Check Landing
                    if (this.pos.y <= 0) {
                        this.pos.y = 0;
                        this.isLanded = true;
                        this.landingTime = this.time;
                        this.totalDistance = this.pos.x;
                    }

                    // Append Trail
                    if (state.visuals.trail && Math.random() > 0.3) {
                        this.trail.push({ ...this.pos });
                    }
                },

                render(ctx, w, h) {
                    // Coordinate system scaling: 1 meter = scale pixels
                    const scale = Math.min(w, h) / 140; 
                    const originX = 60;
                    const originY = h - 60;

                    // Draw Target if Enabled
                    if (this.params.showTarget) {
                        const tx = originX + this.params.targetX * scale;
                        const ty = originY;
                        ctx.fillStyle = '#ef4444';
                        ctx.beginPath();
                        ctx.arc(tx, ty, 12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(tx, ty, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ef4444';
                        ctx.beginPath();
                        ctx.arc(tx, ty, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Trajectory Line
                    if (this.trail.length > 1) {
                        ctx.beginPath();
                        ctx.strokeStyle = state.theme === 'dark' ? 'rgba(96, 165, 250, 0.8)' : 'rgba(37, 99, 235, 0.8)';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([5, 5]);
                        ctx.moveTo(originX + this.trail[0].x * scale, originY - this.trail[0].y * scale);
                        for (let i = 1; i < this.trail.length; i++) {
                            ctx.lineTo(originX + this.trail[i].x * scale, originY - this.trail[i].y * scale);
                        }
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }

                    // Draw Projectile Body
                    const px = originX + this.pos.x * scale;
                    const py = originY - this.pos.y * scale;

                    ctx.fillStyle = '#3b82f6';
                    ctx.shadowColor = '#3b82f6';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(px, py, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Draw Vectors if active
                    if (state.visuals.vectors && !this.isLanded) {
                        // Velocity Vector (Green)
                        drawArrow(ctx, px, py, px + this.vel.x * 1.2, py - this.vel.y * 1.2, '#22c55e', 3, 'V');
                        // Gravity/Force Vector (Red)
                        drawArrow(ctx, px, py, px, py + this.params.gravity * 2, '#ef4444', 3, 'g');
                    }
                },

                getControlsHTML() {
                    return `
                        <div class="space-y-4">
                            <h3 class="font-semibold text-slate-800 dark:text-slate-100 flex items-center space-x-2">
                                <i class="fa-solid fa-sliders text-blue-500"></i><span>Launch Settings</span>
                            </h3>
                            <div class="space-y-2">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-500">Initial Velocity (v₀)</span>
                                    <span class="mono-text font-bold text-blue-500">${this.params.v0} m/s</span>
                                </div>
                                <input type="range" min="5" max="80" value="${this.params.v0}" oninput="labModules.projectile.params.v0 = +this.value; labModules.projectile.init(); updateControlsUI();" class="w-full">
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-500">Launch Angle (θ)</span>
                                    <span class="mono-text font-bold text-blue-500">${this.params.angle}°</span>
                                </div>
                                <input type="range" min="0" max="90" value="${this.params.angle}" oninput="labModules.projectile.params.angle = +this.value; labModules.projectile.init(); updateControlsUI();" class="w-full">
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-500">Launch Height (h)</span>
                                    <span class="mono-text font-bold text-blue-500">${this.params.height} m</span>
                                </div>
                                <input type="range" min="0" max="40" value="${this.params.height}" oninput="labModules.projectile.params.height = +this.value; labModules.projectile.init(); updateControlsUI();" class="w-full">
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-500">Gravity Acceleration (g)</span>
                                    <span class="mono-text font-bold text-blue-500">${this.params.gravity} m/s²</span>
                                </div>
                                <input type="range" min="1" max="25" step="0.1" value="${this.params.gravity}" oninput="labModules.projectile.params.gravity = +this.value; labModules.projectile.init(); updateControlsUI();" class="w-full">
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-500">Target Distance</span>
                                    <span class="mono-text font-bold text-blue-500">${this.params.targetX} m</span>
                                </div>
                                <input type="range" min="20" max="250" value="${this.params.targetX}" oninput="labModules.projectile.params.targetX = +this.value; updateControlsUI();" class="w-full">
                            </div>
                        </div>
                    `;
                },

                getHUDHTML() {
                    const currentVel = Math.sqrt(this.vel.x**2 + this.vel.y**2).toFixed(1);
                    return `
                        <div>Time: <span class="text-blue-500 font-bold">${this.time.toFixed(2)} s</span></div>
                        <div>Distance (X): <span class="text-blue-500 font-bold">${this.pos.x.toFixed(1)} m</span></div>
                        <div>Altitude (Y): <span class="text-blue-500 font-bold">${this.pos.y.toFixed(1)} m</span></div>
                        <div>Velocity: <span class="text-green-500 font-bold">${currentVel} m/s</span></div>
                        <div class="pt-2 border-t border-slate-200 dark:border-slate-700">Max Height: <span class="text-indigo-400 font-bold">${this.maxHeightReached.toFixed(1)} m</span></div>
                    `;
                },

                getTheoryHTML() {
                    return `
                        <h3 class="font-bold text-base text-blue-500 mb-2">2D Projectile Trajectory Dynamics</h3>
                        <p class="mb-3">A projectile moves in two dimensions under constant gravitational acceleration $g$.</p>
                        <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-lg font-mono text-xs space-y-1 mb-4">
                            <div>x(t) = v₀ · cos(θ) · t</div>
                            <div>y(t) = h + v₀ · sin(θ) · t - ½g·t²</div>
                            <div>Range R = (v₀² / g) · sin(2θ)</div>
                            <div>Max Height H = h + (v₀² · sin²(θ)) / (2g)</div>
                        </div>
                    `;
                }
            },

            // -------------------------------------------------------------
            // 2. ELECTROSTATICS
            // -------------------------------------------------------------
            electro: {
                title: "Electrostatics Lab",
                params: {
                    showEquipotentials: true,
                    fieldDensity: 16
                },
                charges: [
                    { id: 1, x: -150, y: 0, q: 5, isDragging: false },
                    { id: 2, x: 150, y: 0, q: -5, isDragging: false }
                ],
                activeDragIndex: -1,

                init() {
                    // Charges are positioned relative to canvas center
                },

                update(dt) {
                    // Static field setup or mobile charges
                },

                render(ctx, w, h) {
                    const cx = w / 2;
                    const cy = h / 2;

                    // 1. Draw Equipotential Curves
                    if (this.params.showEquipotentials) {
                        const gridStep = 25;
                        for (let x = -w/2; x < w/2; x += gridStep) {
                            for (let y = -h/2; y < h/2; y += gridStep) {
                                let potential = 0;
                                this.charges.forEach(c => {
                                    const r = Math.hypot(x - c.x, y - c.y) + 1;
                                    potential += (c.q * 1000) / r;
                                });
                                const alpha = Math.min(Math.abs(potential) * 0.02, 0.3);
                                ctx.fillStyle = potential > 0 ? `rgba(239, 68, 68, ${alpha})` : `rgba(59, 130, 246, ${alpha})`;
                                ctx.fillRect(cx + x - gridStep/2, cy + y - gridStep/2, gridStep, gridStep);
                            }
                        }
                    }

                    // 2. Draw Electric Field Vectors Grid
                    if (state.visuals.vectors) {
                        const step = 40;
                        for (let x = -w/2 + 20; x < w/2; x += step) {

                getControlsHTML() {
                    return `
                        <div class="space-y-4">
                            <h3 class="font-semibold text-slate-800 dark:text-slate-100 flex items-center space-x-2">
                                <i class="fa-solid fa-sliders text-blue-500"></i><span>Orbital Parameters</span>
                            </h3>
                            <div class="space-y-2">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-500">Central Star Mass (M)</span>
                                    <span class="mono-text font-bold text-blue-500">${this.params.centralMass}</span>
                                </div>
                                <input type="range" min="3000" max="25000" step="1000" value="${this.params.centralMass}" oninput="labModules.gravity.params.centralMass = +this.value; labModules.gravity.init(); updateControlsUI();" class="w-full">
                            </div>
                            <div class="space-y-2">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-500">Orbital Launch Speed (v₀)</span>
                                    <span class="mono-text font-bold text-blue-500">${this.params.vLaunch} km/s</span>
                                </div>
                                <input type="range" min="3" max="12" step="0.2" value="${this.params.vLaunch}" oninput="labModules.gravity.params.vLaunch = +this.value; labModules.gravity.init(); updateControlsUI();" class="w-full">
                            </div>
                        </div>
                    `;
                },

                getHUDHTML() {
                    const r = Math.hypot(this.pos.x, this.pos.y).toFixed(1);
                    const speed = Math.hypot(this.vel.x, this.vel.y).toFixed(2);
                    return `
                        <div>Distance from Star (r): <span class="text-blue-500 font-bold">${r} AU</span></div>
                        <div>Orbital Velocity: <span class="text-green-500 font-bold">${speed} km/s</span></div>
                    `;
                },

                getTheoryHTML() {
                    return `
                        <h3 class="font-bold text-base text-blue-500 mb-2">Newton's Universal Gravitation & Kepler's Laws</h3>
                        <p class="mb-3">Every mass attracts every other mass with a force proportional to the product of their masses and inversely proportional to the square of the distance between them.</p>
                        <div class="bg-slate-100 dark:bg-slate-800 p-3 rounded-lg font-mono text-xs space-y-1 mb-4">
                            <div>F_g = G · (M_star · m_planet) / r²</div>
                            <div>Circular Velocity v = √(G·M / r)</div>
                            <div>Kepler's 3rd Law: T² ∝ a³</div>
                        </div>
                    `;
                }
            }
        };

        // Helper: Canvas Arrow Renderer
        function drawArrow(ctx, fromx, fromy, tox, toy, color, width = 2, label = '') {
            const headlen = 9;
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);

            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;

            // Line
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();

            // Arrowhead
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();

            // Label
            if (label) {
                ctx.font = '11px Inter, sans-serif';
                ctx.fillText(label, tox + Math.cos(angle)*10, toy + Math.sin(angle)*10);
            }
            ctx.restore();
        }

        function switchTab(tabId) {
            if (!labModules[tabId]) return;
            state.activeTab = tabId;

            // Update Header Tab UI
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-600', 'dark:text-slate-300', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-600', 'dark:text-slate-300', 'hover:bg-slate-200', 'dark:hover:bg-slate-700');
                activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-md');
            }

            document.getElementById('mobile-tab-select').value = tabId;

            // Re-Initialize Current Module State securely without breaking event loops
            labModules[tabId].init();
            updateControlsUI();
            updateTheoryContent();
        }

        function updateControlsUI() {
            const container = document.getElementById('controls-container');
            const currentMod = labModules[state.activeTab];
            if (currentMod && currentMod.getControlsHTML) {
                container.innerHTML = currentMod.getControlsHTML();
            }
        }

        function updateHUD() {
            const container = document.getElementById('hud-metrics');
            const currentMod = labModules[state.activeTab];
            if (currentMod && currentMod.getHUDHTML) {
                container.innerHTML = currentMod.getHUDHTML();
            }
        }

        function updateTheoryContent() {
            const container = document.getElementById('theory-content');
            const title = document.getElementById('theory-title');
            const currentMod = labModules[state.activeTab];
            if (currentMod) {
                title.innerText = currentMod.title;
                container.innerHTML = currentMod.getTheoryHTML();
            }
        }

        function toggleTheme() {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            const icon = document.getElementById('theme-icon');
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
                icon.className = 'fa-solid fa-moon text-lg';
            } else {
                document.documentElement.classList.remove('dark');
                icon.className = 'fa-solid fa-sun text-lg text-amber-500';
            }
        }

        function togglePlayPause() {
            state.isRunning = !state.isRunning;
            const icon = document.getElementById('play-icon');
            const text = document.getElementById('play-text');
            if (state.isRunning) {
                icon.className = 'fa-solid fa-pause';
                text.innerText = 'Pause';
            } else {
                icon.className = 'fa-solid fa-play';
                text.innerText = 'Play';
            }
        }

        function stepSimulation() {
            state.isRunning = false;
            document.getElementById('play-icon').className = 'fa-solid fa-play';
            document.getElementById('play-text').innerText = 'Play';
            labModules[state.activeTab].update(0.016 * state.simSpeed);
            updateHUD();
        }

        function resetCurrentTab() {
            labModules[state.activeTab].init();
            updateHUD();
        }

        function updateSimSpeed(val) {
            state.simSpeed = parseFloat(val);
            document.getElementById('speed-val').innerText = `${state.simSpeed.toFixed(1)}x`;
        }

        function toggleVisualSetting(setting) {
            state.visuals[setting] = !state.visuals[setting];
            const btn = document.getElementById(`toggle-${setting}`);
            if (state.visuals[setting]) {
                btn.className = "px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 font-medium transition bg-blue-500 text-white";
            } else {
                btn.className = "px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 font-medium transition bg-slate-200 dark:bg-slate-800 text-slate-500";
            }
        }

        function toggleTheoryDrawer() {
            const drawer = document.getElementById('theory-drawer');
            drawer.classList.toggle('translate-x-full');
        }

        function toggleGraphPanel(show) {
            const panel = document.getElementById('graph-panel');
            state.isGraphOpen = show;
            if (show) {
                panel.classList.remove('hidden');
                initChart();
            } else {
                panel.classList.add('hidden');
            }
        }

        // Initialize Chart.js for SHM Plotting
        function initChart() {
            const ctx = document.getElementById('chart-canvas').getContext('2d');
            if (state.chart) state.chart.destroy();

            state.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Displacement (x)', data: [], borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0 },
                        { label: 'Velocity (v)', data: [], borderColor: '#22c55e', borderWidth: 2, pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: { display: false },
                        y: { grid: { color: state.theme === 'dark' ? '#334155' : '#e2e8f0' } }
                    }
                }
            });
        }

        function drawBackgroundGrid(ctx, w, h) {
            if (!state.visuals.grid) return;

            ctx.strokeStyle = state.theme === 'dark' ? 'rgba(255, 255, 255, 0.04)' : 'rgba(0, 0, 0, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 40;

            ctx.beginPath();
            for (let x = 0; x < w; x += gridSize) {
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
            }
            for (let y = 0; y < h; y += gridSize) {
                ctx.moveTo(0, y); ctx.lineTo(w, y);
            }
            ctx.stroke();
        }

        function mainLoop(timestamp) {
            // FPS Calculation
            state.frameCount++;
            if (timestamp - state.lastFpsUpdate >= 1000) {
                state.fps = state.frameCount;
                state.frameCount = 0;
                state.lastFpsUpdate = timestamp;
                document.getElementById('fps-counter').innerText = `${state.fps} FPS`;
            }

            const ctx = state.ctx;
            const w = state.width;
            const h = state.height;

            // Clear Canvas Frame
            ctx.clearRect(0, 0, w, h);

            // Grid Background
            drawBackgroundGrid(ctx, w, h);

            // Active Module Execution
            const currentMod = labModules[state.activeTab];
            if (currentMod) {
                if (state.isRunning) {
                    currentMod.update(state.timeStep * state.simSpeed);
                }
                currentMod.render(ctx, w, h);
                updateHUD();

                // Live Chart Sync for SHM
                if (state.isGraphOpen && state.chart && state.activeTab === 'shm' && currentMod.history) {
                    const data = currentMod.history;
                    state.chart.data.labels = data.map(d => d.time.toFixed(1));
                    state.chart.data.datasets[0].data = data.map(d => d.x);
                    state.chart.data.datasets[1].data = data.map(d => d.v);
                    state.chart.update('none');
                }
            }

            requestAnimationFrame(mainLoop);
        }

        // Window Resize & Event Bindings
        window.addEventListener('resize', handleResize);
        function handleResize() {
            const canvas = state.canvas;
            if (!canvas) return;
            const container = canvas.parentElement;
            state.width = container.clientWidth;
            state.height = container.clientHeight;
            canvas.width = state.width;
            canvas.height = state.height;
        }

        // Canvas Mouse Interaction Hooks
        window.onload = function() {
            state.canvas = document.getElementById('lab-canvas');
            state.ctx = state.canvas.getContext('2d');
            handleResize();

            // Set Initial Dark Theme
            document.documentElement.classList.add('dark');

            // Attach Mouse Events for Interactive Dragging
            state.canvas.addEventListener('mousedown', (e) => {
                const mod = labModules[state.activeTab];
                if (mod.handleMouseDown) mod.handleMouseDown(e, state.width, state.height);
            });

            state.canvas.addEventListener('mousemove', (e) => {
                const mod = labModules[state.activeTab];
                if (mod.handleMouseMove) mod.handleMouseMove(e, state.width, state.height);
            });

            window.addEventListener('mouseup', () => {
                const mod = labModules[state.activeTab];
                if (mod.handleMouseUp) mod.handleMouseUp();
            });

            // Initialize default module and kick off loop
            switchTab('projectile');
            requestAnimationFrame(mainLoop);
        };
    </script>
</body>
</html>
